<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamoPro AI V30 - Full Automated Flow</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, sans-serif; color: #fff; overflow-x: hidden; }
        #camera-view, #gallery-view, #order-view { display: none; min-height: 100vh; width: 100vw; }
        #camera-view { display: flex; flex-direction: column; }
        #sensor-auth { position: fixed; inset: 0; background: #000; z-index: 9000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid #222; background: #000; }
        #viewport { position: relative; flex-grow: 1; margin: 10px; overflow: hidden; border-radius: 20px; display: flex; justify-content: center; align-items: center; background: #000; border: 2px solid #222; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #fixed-guide { position: absolute; width: 110px; height: 150px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 8px; z-index: 5; }
        #dynamic-guide { position: absolute; width: 110px; height: 150px; border: 3px solid #ff4444; border-radius: 8px; z-index: 6; transition: border-color 0.2s; }
        #status-msg { position: absolute; top: 15px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 15px; font-size: 10px; font-weight: bold; text-transform: uppercase; z-index: 10; color: #ff4444; }
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .gallery-item { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid #333; transition: 0.3s; }
        .gallery-item.selected { border-color: #00ff00; transform: scale(1.02); }
        .gallery-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .check-badge { position: absolute; top: 10px; right: 10px; background: #00ff00; color: #000; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .preview-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .preview-overlay.active { display: flex; }
        .preview-overlay img { max-width: 95vw; max-height: 80vh; object-fit: contain; border-radius: 10px; }
        .preview-close { margin-top: 20px; background: #00ff00; color: #000; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 800; font-size: 14px; cursor: pointer; }
        .form-container { padding: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: #fff; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #00ff00; outline: none; background: #222; }
        .summary-card { background: #111; padding: 20px; border-radius: 15px; margin-top: 30px; border: 1px solid #222; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .total-row { border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; font-size: 22px; font-weight: 900; color: #00ff00; }
        .footer-action { padding: 20px; background: #000; border-top: 1px solid #222; text-align: center; }
        .btn-main { background: #00ff00; color: #000; border: none; padding: 18px 0; width: 100%; border-radius: 35px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-size: 14px; letter-spacing: 1px; }
        .btn-main:disabled { background: #333; color: #666; }
    </style>
</head>
<body>

<div id="sensor-auth">
    <h1 style="color: #00ff00; letter-spacing: 3px; font-weight: 900;">CAMOPRO AI</h1>
    <p style="color: #666; margin-bottom: 30px;">Automated Texture Cloning System</p>
    <button class="btn-main" id="start-btn" style="max-width: 280px;">INITIALIZE SCANNER</button>
</div>

<div id="camera-view">
    <div class="header"><span style="font-weight: 800; color: #00ff00; letter-spacing: 1px;">SCANNER ACTIVE</span></div>
    <div id="viewport">
        <div id="status-msg">AIM AT OUTLET</div>
        <video id="video" autoplay playsinline muted></video>
        <div id="fixed-guide"></div>
        <div id="dynamic-guide"></div>
    </div>
    <div class="footer-action">
        <div id="capture-indicator" style="margin-bottom: 15px; font-size: 11px; color: #00ff00; font-weight: bold;">0 OUTLETS CAPTURED</div>
        <button id="go-to-gallery" class="btn-main" style="display: none;">VALIDATE SELECTION</button>
    </div>
</div>

<div id="gallery-view">
    <div style="padding: 25px 25px 5px 25px;">
        <h2 style="color: #00ff00; margin: 0; font-weight: 900;">GALLERY</h2>
        <p style="color: #888; font-size: 13px;">Tap photo to preview. Tap again to select/deselect.</p>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <div class="footer-action">
        <button id="go-to-form" class="btn-main">PROCEED TO CHECKOUT</button>
    </div>
</div>

<div id="preview-overlay" class="preview-overlay">
    <img
