<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamoPro AI V34</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; font-family: -apple-system, sans-serif; color: #fff; }
        #page1 { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
        #page2 { display: none; flex-direction: column; min-height: 100vh; }
        #viewport { position: relative; flex: 1; margin: 10px; border-radius: 20px; overflow: hidden; background: #000; border: 2px solid #222; display: flex; justify-content: center; align-items: center; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #guide { position: absolute; width: 140px; height: 180px; border: 3px solid #ff4444; border-radius: 10px; z-index: 5; transition: border-color 0.3s; }
        #status { position: absolute; top: 15px; background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; z-index: 10; color: #ff4444; }
        #instruction { position: absolute; bottom: 15px; background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 15px; font-size: 11px; z-index: 10; color: #888; }
        .controls { padding: 20px; background: #000; border-top: 1px solid #111; display: flex; justify-content: center; align-items: center; gap: 20px; }
        #capture-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #555; background: #222; cursor: pointer; }
        #capture-btn.ready { border-color: #00ff00; background: #00ff00; }
        #capture-btn:disabled { opacity: 0.3; }
        #counter { color: #00ff00; font-size: 22px; font-weight: 900; min-width: 40px; text-align: center; }
        #review-btn { background: transparent; color: #00ff00; border: 1px solid #333; padding: 10px 16px; border-radius: 20px; font-size: 11px; cursor: pointer; display: none; }
        .btn-green { background: #00ff00; color: #000; border: none; padding: 16px 0; width: 100%; max-width: 280px; border-radius: 35px; font-weight: 900; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div id="page1">
    <h1 style="color:#00ff00;font-size:32px;letter-spacing:3px;margin:0 0 8px;">CAMOPRO AI</h1>
    <p style="color:#aaa;font-size:13px;margin:0 0 40px;">Texture Cloning System V34</p>
    <button class="btn-green" onclick="startApp()">INITIALIZE SCANNER</button>
</div>

<div id="page2">
    <div style="padding:12px 15px;background:#000;border-bottom:1px solid #111;display:flex;justify-content:space-between;">
        <span style="color:#00ff00;font-size:12px;font-weight:900;">● SCANNER ACTIVE</span>
        <span id="header-count" style="color:#444;font-size:11px;">0 captured</span>
    </div>
    <div id="viewport">
        <video id="video" autoplay playsinline muted></video>
        <div id="guide"></div>
        <div id="status">AIM AT OUTLET</div>
        <div id="instruction">Center outlet in frame</div>
    </div>
    <div class="controls">
        <div id="counter">0</div>
        <button id="capture-btn" disabled onclick="doCapture()"></button>
        <button id="review-btn" onclick="goGallery()">REVIEW</button>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var guide = document.getElementById('guide');
    var status = document.getElementById('status');
    var instruction = document.getElementById('instruction');
    var captureBtn = document.getElementById('capture-btn');
    var capturedPhotos = [];
    var aligned = false;
    var perspOk = false;
    var analyzing = false;

    var GEMINI_KEY = 'AIzaSyAyNE-TuIGurcIPnrmPft9upEP5RR0ds-g';
    var GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GEMINI_KEY;
    var MAKE_URL = 'https://hook.us2.make.com/54xeiu9j4733vbvnfjm7lah2u4wkjm1r';
    var STRIPE = 'https://buy.stripe.com/4gM4gyesH7Wv92feQt7EQ00';
    var PRICE = 29.99;

    function startApp() {
        document.getElementById('page1').style.display = 'none';
        document.getElementById('page2').style.display = 'flex';

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
                video.srcObject = stream;
                video.play().catch(function(){});
            })
            .catch(function() { alert("Camera access required."); });

        window.addEventListener('deviceorientation', handleOrientation);

        // Fallback — si no hay giroscopio después de 3s activa el botón
        setTimeout(function() {
            if (!aligned) {
                aligned = true;
                perspOk = true;
                guide.style.borderColor = '#00ff00';
                status.innerText = 'READY TO CAPTURE';
                status.style.color = '#00ff00';
                instruction.innerText = 'Press button to capture';
                captureBtn.disabled = false;
                captureBtn.classList.add('ready');
            }
        }, 3000);
    }

    function handleOrientation(e) {
        if (analyzing) return;
        var beta = e.beta || 0;
        var gamma = e.gamma || 0;
        var targetB = (beta > 45 && beta < 135) ? 90 : 0;
        var dV = Math.abs(beta - targetB);
        var dL = Math.abs(gamma);
        perspOk = Math.abs(gamma) < 20 && (beta > 45 ? Math.abs(beta-90) < 20 : Math.abs(beta) < 20);

        if (dV < 15 && dL < 15) {
            aligned = true;
            if (!perspOk) {
                guide.style.borderColor = '#ffaa00';
                status.innerText = 'ADJUST ANGLE';
                status.style.color = '#ffaa00';
                instruction.innerText = 'Hold phone straighter';
                captureBtn.disabled = true;
                captureBtn.classList.remove('ready');
            } else {
                guide.style.borderColor = '#00ff00';
                status.innerText = 'READY — PRESS CAPTURE';
                status.style.color = '#00ff00';
                instruction.innerText = 'Press button to capture';
                captureBtn.disabled = false;
                captureBtn.classList.add('ready');
            }
        } else {
            aligned = false;
            guide.style.borderColor = '#ff4444';
            status.innerText = 'AIM AT OUTLET';
            status.style.color = '#ff4444';
            instruction.innerText = 'Center outlet in frame';
            captureBtn.disabled = true;
            captureBtn.classList.remove('ready');
        }
    }

    function doCapture() {
        if (analyzing) return;
        analyzing = true;
        captureBtn.disabled = true;
        captureBtn.classList.remove('ready');
        status.innerText = 'ANALYZING...';
        status.style.color = '#00aaff';

        var temp = document.createElement('canvas');
        temp.width = 640; temp.height = 480;
        temp.getContext('2d').drawImage(video, 0, 0, 640, 480);
        var frameBase64 = temp.toDataURL('image/jpeg', 0.8).split(',')[1];

        fetch(GEMINI_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [
                    { text: 'Analyze this image. Respond ONLY with valid JSON, no markdown. Detect electrical outlets, sockets, or wall switches. Format: {"outlet_detected":true,"outlet_type":"TYPE","confidence":85,"count":1}. If none: {"outlet_detected":false,"outlet_type":null,"confidence":0,"count":0}. Types: "GFCI Duplex","Standard Duplex","USB Duplex","Single Outlet","Triplex","Quad Outlet","Smart Outlet","Schuko EU","UK BS1363","Single Switch","Double Switch","Triple Switch","Dimmer Switch","Smart Switch","Unknown Wall Plate".' },
                    { inline_data: { mime_type: 'image/jpeg', data: frameBase64 } }
                ]}],
                generationConfig: { maxOutputTokens: 150, temperature: 0.1 }
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text) || '';
            var match = text.match(/\{[\s\S]*\}/);
            if (match) {
                var result = JSON.parse(match[0]);
                if (result.outlet_detected && result.confidence >= 60) {
                    // CAPTURE
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    capturedPhotos.push({
                        id: Date.now(),
                        data: canvas.toDataURL('image/jpeg', 0.95),
                        outletType: result.outlet_type,
                        selected: true,
                        timestamp: new Date().toISOString()
                    });
                    var n = capturedPhotos.length;
                    document.getElementById('counter').innerText = n;
                    document.getElementById('header-count').innerText = n + ' captured';
                    document.getElementById('review-btn').style.display = 'block';
                    status.innerText = 'CAPTURED: ' + result.outlet_type;
                    status.style.color = '#00ff00';
                    guide.style.borderColor = '#00ff00';
                    if (navigator.vibrate) navigator.vibrate([80,40,150]);
                    setTimeout(function() {
                        analyzing = false;
                        status.innerText = 'AIM AT OUTLET';
                        status.style.color = '#ff4444';
                        guide.style.borderColor = '#ff4444';
                        captureBtn.classList.remove('ready');
                    }, 2500);
                } else {
                    status.innerText = 'NO OUTLET DETECTED';
                    status.style.color = '#ff4444';
                    instruction.innerText = 'Make sure outlet fills the frame';
                    setTimeout(function() {
                        analyzing = false;
                        if (aligned && perspOk) {
                            captureBtn.disabled = false;
                            captureBtn.classList.add('ready');
                            status.innerText = 'READY — PRESS CAPTURE';
                            status.style.color = '#00ff00';
                        } else {
                            status.innerText = 'AIM AT OUTLET';
                            status.style.color = '#ff4444';
                        }
                    }, 2000);
                }
            } else {
                throw new Error('No JSON');
            }
        })
        .catch(function(err) {
            console.error(err);
            status.innerText = 'ERROR — TRY AGAIN';
            status.style.color = '#ff4444';
            setTimeout(function() {
                analyzing = false;
                if (aligned && perspOk) {
                    captureBtn.disabled = false;
                    captureBtn.classList.add('ready');
                    status.innerText = 'READY — PRESS CAPTURE';
                    status.style.color = '#00ff00';
                } else {
                    status.innerText = 'AIM AT OUTLET';
                    status.style.color = '#ff4444';
                }
            }, 2000);
        });
    }

    function goGallery() {
        alert('Gallery coming soon — ' + capturedPhotos.length + ' photos captured');
    }
</script>
</body>
</html>
