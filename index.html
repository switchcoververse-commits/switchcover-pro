<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        button { background:#00ff00; color:#000; padding:20px 40px; font-size:18px; font-weight:900; border:none; border-radius:20px; }
        video { width:100vw; height:60vh; object-fit:cover; display:block; }
    </style>
</head>
<body>
    <div id="page1" style="text-align:center;">
        <button onclick="startCamera()">START CAMERA</button>
    </div>
    <div id="page2" style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <p style="color:#00ff00;text-align:center;font-size:14px;" id="msg">Camera loading...</p>
    </div>
    <script>
        function startCamera() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    video.play().catch(e => {
                        document.getElementById('msg').innerText = 'Play error: ' + e.message;
                    });
                    document.getElementById('msg').innerText = 'Camera active!';
                })
                .catch(e => {
                    document.getElementById('msg').innerText = 'Camera error: ' + e.message;
                });
        }
    </script>
</body>
</html>
        .catch(() => alert("Camera access required."));
}
