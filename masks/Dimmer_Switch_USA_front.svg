<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="825" viewBox="0 0 1350 825">
  <!-- CamoPro SVG Mask - FRONT -->
  <!-- Outlet: Dimmer Switch USA -->
  <!-- Plate: 70mm x 114mm + 5mm border -->
  <!-- Country: USA -->
  <!-- Canvas: 1350x825px at 300 DPI -->
  
  <!-- Black background = transparent (dest-in blend) -->
  <rect width="1350" height="825" fill="black"/>
  
  <!-- White area = keep texture -->
  <rect x="202.6" y="-319.8" width="944.9" height="1464.6" rx="12" ry="12" fill="white"/>
  
  <!-- Die-cut openings (black = cut through) -->
  <rect x="450.6" y="70.0" width="448.8" height="531.5" rx="4" ry="4" fill="black"/>
  <rect x="568.7" y="684.2" width="212.6" height="94.5" rx="2" ry="2" fill="black"/>

</svg>