<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="825" viewBox="0 0 1350 825">
  <!-- CamoPro SVG Mask - FRONT -->
  <!-- Outlet: Double Switch EU -->
  <!-- Plate: 140mm x 80mm + 5mm border -->
  <!-- Country: EU -->
  <!-- Canvas: 1350x825px at 300 DPI -->
  
  <!-- Black background = transparent (dest-in blend) -->
  <rect width="1350" height="825" fill="black"/>
  
  <!-- White area = keep texture -->
  <rect x="-210.8" y="-119.0" width="1771.6" height="1063.0" rx="12" ry="12" fill="white"/>
  
  <!-- Die-cut openings (black = cut through) -->
  <rect x="25.4" y="176.3" width="472.4" height="472.4" rx="4" ry="4" fill="black"/>
  <rect x="852.2" y="176.3" width="472.4" height="472.4" rx="4" ry="4" fill="black"/>

</svg>