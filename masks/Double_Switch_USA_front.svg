<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="825" viewBox="0 0 1350 825">
  <!-- CamoPro SVG Mask - FRONT -->
  <!-- Outlet: Double Switch USA -->
  <!-- Plate: 114mm x 114mm + 5mm border -->
  <!-- Country: USA -->
  <!-- Canvas: 1350x825px at 300 DPI -->
  
  <!-- Black background = transparent (dest-in blend) -->
  <rect width="1350" height="825" fill="black"/>
  
  <!-- White area = keep texture -->
  <rect x="-57.3" y="-319.8" width="1464.6" height="1464.6" rx="12" ry="12" fill="white"/>
  
  <!-- Die-cut openings (black = cut through) -->
  <rect x="214.4" y="235.3" width="259.8" height="354.3" rx="3" ry="3" fill="black"/>
  <rect x="875.8" y="235.3" width="259.8" height="354.3" rx="3" ry="3" fill="black"/>

</svg>