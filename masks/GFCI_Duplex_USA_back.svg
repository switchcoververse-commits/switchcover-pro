  <!-- Total sticker area -->
  <rect x="202.6" y="-319.8" width="944.9" height="1464.6" rx="12" ry="12" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- FOLD LINE - dashed inner rectangle (exact plate edge) -->
  <rect x="261.6" y="-260.7" width="826.8" height="1346.5" rx="8" ry="8" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="8,4"/>
  
