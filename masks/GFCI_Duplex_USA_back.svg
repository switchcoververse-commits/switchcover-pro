  <text x="675.0" y="-266.7" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">FOLD LINE</text>
  <text x="675.0" y="1099.7" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">FOLD LINE</text>
  <text x="255.6" y="412.5" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" transform="rotate(-90,255.6,412.5)">FOLD LINE</text>
  <text x="1102.4" y="412.5" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" transform="rotate(90,1102.4,412.5)">FOLD LINE</text>
  
  <!-- Opening markers -->
  <rect x="474.2" y="-119.0" width="118.1" height="189.0" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
