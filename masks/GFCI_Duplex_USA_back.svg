  <!-- CamoPro branding -->
  <text x="675.0" y="-299.8" font-family="Arial" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">CamoPro Sticker</text>
  
  <!-- Outlet type label -->
  <text x="675.0" y="-284.8" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">GFCI Duplex USA</text>

  <!-- Installation steps -->
  <text x="217.6" y="-126.1" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Installation:</text>
  <text x="217.6" y="-104.1" font-family="Arial" font-size="9" fill="#444">1. Clean plate surface</text>
  <text x="217.6" y="-82.1" font-family="Arial" font-size="9" fill="#444">2. Peel backing paper</text>
  <text x="217.6" y="-60.1" font-family="Arial" font-size="9" fill="#444">3. Align with plate edges</text>
  <text x="217.6" y="-38.1" font-family="Arial" font-size="9" fill="#444">4. Press firmly from center</text>
  <text x="217.6" y="-16.1" font-family="Arial" font-size="9" fill="#444">5. Fold border edges around plate</text>
  
  <!-- Warning -->
  <text x="675.0" y="1126.8" font-family="Arial" font-size="8" fill="#cc0000" text-anchor="middle">⚠ Do not cover live electrical contacts</text>
  
  <!-- Dimensions -->
  <text x="675.0" y="1138.8" font-family="Arial" font-size="7" fill="#999" text-anchor="middle">70mm × 114mm + 5mm border | USA</text>

