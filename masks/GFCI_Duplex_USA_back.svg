  <rect x="521.5" y="400.7" width="307.1" height="118.1" rx="2" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <rect x="474.2" y="589.7" width="118.1" height="189.0" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <rect x="639.6" y="589.7" width="118.1" height="189.0" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <rect x="556.9" y="802.3" width="94.5" height="94.5" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1"/>

  
  <!-- Screw hole markers -->
  <circle cx="675.0" cy="-201.7" r="39.4" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="632.6" y1="-201.7" x2="717.4" y2="-201.7" stroke="#666" stroke-width="1"/>
